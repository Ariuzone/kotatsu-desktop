# Portage Windows de Kotatsu-Redo — build de l'installateur .exe sur runner Windows.
# Fichier modifié (projet nouveau, dérivé de Kotatsu-Redo) — 2026-11-05.

name: Windows release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # jpackage (inclus dans le JDK) produit l'installateur ; WiX est déjà présent
      # sur les runners windows-latest (wix3.x via chocolatey) — l'invite « .exe »
      # de jpackage nécessite WiX 3.
      - name: Ensure WiX 3
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe")) {
            choco install wixtoolset --version=3.14.1 -y
          }

      - name: Build executable
        run: ./gradlew :desktop:packageExe --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-windows-installer
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/exe/*.exe
